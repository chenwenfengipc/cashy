name: cashy
description: Voice-powered expense tracker. Speak to log income and expenses.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # === Speech-to-Text (Moonshine via sherpa-onnx) ===
  sherpa_onnx: ^1.12.0

  # === Audio recording ===
  record: ^6.1.2

  # === Local database ===
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4    # FFI adapter for Windows/macOS/Linux
  sqlite3_flutter_libs: ^0.5.0  # Bundles SQLite library on desktop
  path_provider: ^2.1.5
  path: ^1.9.1

  # === State management ===
  provider: ^6.1.2

  # === Charts & visualization ===
  fl_chart: ^0.70.2

  # === Utilities ===
  intl: ^0.19.0          # Date/number formatting
  uuid: ^4.5.1           # Unique IDs
  share_plus: ^10.1.4    # Export backups via the OS share sheet

  # === Future: TinyBERT NLU fallback ===
  # onnxruntime_v2: ^1.23.0    # uncomment when adding TinyBERT
  # dart_wordpiece: ^1.2.0     # uncomment when adding TinyBERT

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/models/moonshine-tiny-en/
    - assets/models/sense-voice-zh-en/
    - assets/patterns/
